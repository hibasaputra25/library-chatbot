################################################################################
# NGINX CONFIGURATION FOR PUSTAKABOT
# Universitas Mercu Buana
#
# This file should be placed at: /etc/nginx/sites-available/chatbot
# Then create symbolic link: sudo ln -s /etc/nginx/sites-available/chatbot /etc/nginx/sites-enabled/
#
# After editing:
#   sudo nginx -t           # Test configuration
#   sudo systemctl reload nginx   # Apply changes
################################################################################

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;

# Upstream servers
upstream chatbot_core {
    server localhost:3003 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream chatbot_gateway {
    server localhost:3002 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

################################################################################
# HTTP SERVER (Port 80)
################################################################################
server {
    listen 80;
    listen [::]:80;
    
    # IMPORTANT: Update with your actual domain
    server_name _;
    
    # Server tokens off for security
    server_tokens off;
    
    # Logging
    access_log /var/log/nginx/chatbot-access.log;
    error_log /var/log/nginx/chatbot-error.log warn;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # SSL certificate (managed by Certbot)
    # These lines will be added automatically by Certbot
    # Uncomment after running: sudo certbot --nginx -d your-domain.com
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # ========================================================================
    # WEBSOCKET - Admin panel WA connection
    # ========================================================================
    location /admin/ws-gateway {
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ========================================================================
    # WA GATEWAY PROXY - Reconnect/logout via admin panel
    # ========================================================================
    location /wa-gateway/ {
        proxy_pass http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================================================
    # ADMIN PANEL - Protected with Basic Auth
    # ========================================================================
    location /admin {
        # Rate limiting for admin panel
        limit_req zone=admin_limit burst=10 nodelay;
        
        # Proxy to Node.js core service
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # ========================================================================
    # API ENDPOINTS - Rate limited
    # ========================================================================
    location /api {
        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy to Node.js core service
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for API calls
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # CORS headers (if needed for external API access)
        # add_header 'Access-Control-Allow-Origin' '*' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        # Handle preflight requests
        # if ($request_method = 'OPTIONS') {
        #     return 204;
        # }
    }
    
    # ========================================================================
    # PROCESS MESSAGE ENDPOINT - WhatsApp Webhook
    # ========================================================================
    location /process-message {
        # Higher rate limit for message processing
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeout for message processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Increase buffer size for large messages
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # ========================================================================
    # HEALTH CHECK ENDPOINT - No rate limit, no logging
    # ========================================================================
    location /health {
        access_log off;
        
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        
        # Quick timeout for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # ========================================================================
    # STATIC FILES (if any) - Cache aggressively
    # ========================================================================
    location /public {
        alias /home/chatbot/apps/server_chatbot/public;
        
        # Cache static files
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Security
        add_header X-Content-Type-Options "nosniff" always;
        
        # Gzip compression
        gzip_static on;
    }
    
    # Static file types - proxy to Express (served via express.static)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ========================================================================
    # LOGIN PAGE
    # ========================================================================
    location /login {
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # AUTH ENDPOINTS
    # ========================================================================
    location /auth {
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # ROOT - Redirect to admin
    # ========================================================================
    location / {
        proxy_pass http://chatbot_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
    
    # ========================================================================
    # SECURITY - Block common attack patterns
    # ========================================================================
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to sensitive files
    location ~* \.(sql|log|env|json|git|svn)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to node_modules
    location ~ /node_modules/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ========================================================================
    # ERROR PAGES
    # ========================================================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

################################################################################
# HTTPS SERVER (Port 443) - Will be configured by Certbot
################################################################################
# After running: sudo certbot --nginx -d your-domain.com
# Certbot will automatically add HTTPS configuration here


